<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Participation indépendante - Démonstration</title>
  <link rel="stylesheet" href="style.css?v=20261009">
</head>
<body>
  <div class="background-wrapper">
    <div class="container">
      <h1 class="main-title">Participation<br>indépendante</h1>
      <h2 class="form-title">Démonstration de participation<br>à une récompense</h2>
      <p class="form-subtitle">Aucune récompense n'est garantie.</p>

      <p class="independent-notice">
        Démonstration non affiliée à Airtel Money, HaloPesa ou Mixx TZ.
        N'entrez jamais votre code PIN. Aucune donnée n'est envoyée ni enregistrée.
      </p>

      <form id="registrationForm">
        <div class="form-group">
          <input 
            type="tel"
            id="name"
            placeholder="Votre numéro de téléphone"
            aria-label="Votre numéro de téléphone"
            autocomplete="tel"
            required
          >
          <span class="error" id="nameError"></span>
        </div>

        <button type="submit" class="btn-submit">ESSAYER LA DÉMONSTRATION</button>
      </form>

      <!-- Success/Error Messages -->
      <div id="successMessage" class="message success" style="display: none;"></div>
      <div id="errorMessage" class="message error" style="display: none;"></div>

      <!-- Loading State -->
      <div id="loadingSpinner" class="spinner" style="display: none;"></div>

      <div class="admin-link">
        <a href="/admin">📊 Admin Panel</a>
      </div>
    </div>
  </div>

  <script src="app.js?v=20261007"></script>
</body>
</html>
